<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuidemos a los Pandas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <p class="texto-verde">

        <!-- Escenario donde ocurre la animación -->

                <!-- Tu imagen exportada sin fondo -->

            </div>
            <!-- Rama generada con CSS -->
            <div class="rama"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
